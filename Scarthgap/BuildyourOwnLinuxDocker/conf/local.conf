# Local configuration for building Docker container images
MACHINE = "qemuarm64"

# Build output directories
TMPDIR = "/home/poky/tempdir"

# Custom container-focused distribution policy
DISTRO = "bearcreekdocker"

# Package format
PACKAGE_CLASSES ?= "package_ipk"

# Required for meta-virtualization
DISTRO_FEATURES:append = " virtualization"

# Container optimization: Do not compile a hardware kernel
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"

# Image disk space conservation
INHERIT += "rm_work"

# Concurrency limits for Mac host stability
BB_NUMBER_THREADS = "2"
PARALLEL_MAKE = "-j 2"
