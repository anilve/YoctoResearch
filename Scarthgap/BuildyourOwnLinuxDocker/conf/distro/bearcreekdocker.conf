DISTRO = "bearcreekdocker"
DISTRO_NAME = "Bear Creek Tech Docker Linux"
DISTRO_VERSION = "1.0.0"

PACKAGE_CLASSES = "package_ipk"
MACHINE = "qemuarm64"

# Required for meta-virtualization functionality
DISTRO_FEATURES = "virtualization ipv4 ipv6"

# Default fallback image type for distro recipes (use ?= so specific images can override)
IMAGE_FSTYPES ?= "tar.xz"

# Optimization: bypass compiling a real kernel since containers utilize the host kernel
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
